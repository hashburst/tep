name: TEP v1.0 G3 anti-equivocation production CI
on:
  push:
    branches: [mainnet/v1.0.0-g1-enrollment]
    paths: [src/hashburst_tep/anti_equivocation.py, src/hashburst_tep/domains.py, tests/test_anti_equivocation_production_v100.py, .github/workflows/v100-g3-anti-equivocation-ci.yml]
permissions: {contents: read}
jobs:
  conformance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-rc1.txt
      - env: {PYTHONPATH: src}
        run: |
          set -euo pipefail
          python -m unittest tests.test_anti_equivocation_production_v100 -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          echo "ANTI_EQUIVOCATION_PRODUCTION_CI_OK sha=$GITHUB_SHA"
