name: TEP v1.0 G3 anti-equivocation four-host gate
on:
  push:
    branches: [mainnet/v1.0.0-g1-enrollment]
    paths: [src/hashburst_tep/anti_equivocation.py, src/hashburst_tep/domains.py, tools/testnet_peer_v040.py, .github/workflows/v100-g3-anti-equivocation-4host.yml]
permissions: {contents: read}
concurrency:
  group: tep-v100-g3-anti-equivocation-4host
  cancel-in-progress: false
jobs:
  real-peer-lock:
    strategy:
      fail-fast: false
      matrix: {node: ["153","154","155","157"]}
    runs-on: [self-hosted, "tep-testnet-${{ matrix.node }}"]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Deploy exact peer and establish persistent lock
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          sudo -n /usr/local/sbin/hashburst-testnet-admin install-payload "$GITHUB_WORKSPACE"
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health > health.json 2>/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json,hashlib,urllib.request,urllib.error
          h=json.load(open("health.json"));fid=hashlib.sha3_256(b"HB-TEP-G3-FEDERATION-v1").hexdigest();sd=hashlib.sha3_256(b"HB-TEP-G3-SET-v1").hexdigest();a=hashlib.sha3_256(b"HB-TEP-G3-PROPOSAL-A-v1").hexdigest();b=hashlib.sha3_256(b"HB-TEP-G3-PROPOSAL-B-v1").hexdigest()
          def vote(pd):
           body=json.dumps({"federation_id":fid,"validator_set_version":31,"count":7301,"validator_set_digest":sd,"proposal_digest":pd}).encode();r=urllib.request.Request("http://127.0.0.1:47840/governance/vote",data=body,headers={"Content-Type":"application/json"});return json.load(urllib.request.urlopen(r,timeout=3))
          first=vote(a);assert first["lock_status"] in ("LOCKED","IDEMPOTENT");same=vote(a);assert same["lock_status"]=="IDEMPOTENT" and same["signature"]==first["signature"]
          try:vote(b);raise AssertionError("conflicting proposal accepted")
          except urllib.error.HTTPError as e:assert e.code==400
          json.dump({"node_id":h["node_id"],"public_key":h["public_key"],"federation_id":fid,"set_digest":sd,"proposal_a":a,"proposal_b":b,"signature":first["signature"]},open("g3.json","w"))
          print("ANTI_EQUIVOCATION_REAL_LOCK_OK node_id="+h["node_id"]+" idempotent=1 conflict_rejected=1")
          PY
      - name: Restart and prove replay/conflict permanence
        run: |
          set -euo pipefail
          BEFORE=$(python3 -c 'import json;print(json.load(open("health.json"))["node_id"])')
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health > health2.json 2>/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          x=json.load(open("g3.json"));h=json.load(open("health2.json"));assert h["node_id"]==x["node_id"]
          def vote(pd):
           body=json.dumps({"federation_id":x["federation_id"],"validator_set_version":31,"count":7301,"validator_set_digest":x["set_digest"],"proposal_digest":pd}).encode();r=urllib.request.Request("http://127.0.0.1:47840/governance/vote",data=body,headers={"Content-Type":"application/json"});return json.load(urllib.request.urlopen(r,timeout=3))
          same=vote(x["proposal_a"]);assert same["lock_status"]=="IDEMPOTENT" and same["signature"]==x["signature"]
          try:vote(x["proposal_b"]);raise AssertionError("conflict accepted after restart")
          except urllib.error.HTTPError as e:assert e.code==400
          print("ANTI_EQUIVOCATION_RESTART_REPLAY_OK node_id="+h["node_id"]+" replay_idempotent=1 conflict_permanent=1")
          PY
      - name: Fault injection and recovery
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hashburst-testnet-admin stop
          if curl -fsS --max-time 2 http://127.0.0.1:47840/health >/dev/null 2>&1; then echo "peer remained reachable"; exit 1; fi
          echo "ANTI_EQUIVOCATION_FAULT_INJECTED_DOWN_OK"
          sudo -n /usr/local/sbin/hashburst-testnet-admin start
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health >/dev/null 2>&1 && break; sleep 1; done
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          x=json.load(open("g3.json"))
          def vote(pd):
           body=json.dumps({"federation_id":x["federation_id"],"validator_set_version":31,"count":7301,"validator_set_digest":x["set_digest"],"proposal_digest":pd}).encode();r=urllib.request.Request("http://127.0.0.1:47840/governance/vote",data=body,headers={"Content-Type":"application/json"});return json.load(urllib.request.urlopen(r,timeout=3))
          assert vote(x["proposal_a"])["lock_status"]=="IDEMPOTENT"
          try:vote(x["proposal_b"]);raise AssertionError("conflict accepted after fault recovery")
          except urllib.error.HTTPError as e:assert e.code==400
          print("ANTI_EQUIVOCATION_FAULT_RECOVERY_OK lock_preserved=1 conflict_permanent=1")
          PY
  certify:
    needs: [real-peer-lock]
    runs-on: ubuntu-22.04
    steps:
      - run: echo "ANTI_EQUIVOCATION_REPLAY_PRODUCTION_4OF4_OK persistent_vote_lock=1 idempotent_replay=1 conflicting_vote_rejected=1 restart_continuity=1 fault_injection_recovery=1"
