name: TEP v1.0 G4 genesis network four-host gate
on:
  push:
    branches: [mainnet/v1.0.0-g1-enrollment]
    paths: [src/hashburst_tep/network_genesis.py, src/hashburst_tep/domains.py, tools/testnet_peer_v040.py, .github/workflows/v100-g4-genesis-4host.yml]
permissions: {contents: read}
concurrency:
  group: tep-v100-g4-genesis-4host
  cancel-in-progress: false
jobs:
  identity:
    strategy:
      fail-fast: false
      matrix: {node: ["153","154","155","157"]}
    runs-on: [self-hosted, "tep-testnet-${{ matrix.node }}"]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          sudo -n /usr/local/sbin/hashburst-testnet-admin install-payload "$GITHUB_WORKSPACE"
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health > identity.json 2>/dev/null && break; sleep 1; done
          python3 -c 'import json;d=json.load(open("identity.json"));assert len(d["node_id"])==64 and len(d["public_key"])==64'
      - uses: actions/upload-artifact@v4
        with: {name: "g4-identity-${{ matrix.node }}", path: identity.json}
  manifest:
    needs: [identity]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {pattern: "g4-identity-*", path: ids}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install cryptography==50.0.2
      - env: {PYTHONPATH: src}
        run: |
          python - <<'PY'
          import glob,json
          from hashlib import sha3_256
          from hashburst_tep.federation import Validator,ValidatorSet
          from hashburst_tep.network_genesis import *
          ids=[json.load(open(p)) for p in sorted(glob.glob("ids/**/identity.json",recursive=True))]
          vs=ValidatorSet(1,tuple(Validator(bytes.fromhex(x["node_id"]),bytes.fromhex(x["public_key"])) for x in ids))
          net=sha3_256(b"HashBurst TEP Mainnet v1").digest();chain=sha3_256(b"HashBurst TEP Production Chain").digest()
          g=ProductionGenesis(net,chain,1,vs,ConsensusParameters(2,3,30),VDFParameters(b"CG-WESO-v1",1024,4096))
          json.dump({"network_id":net.hex(),"chain_id":chain.hex(),"genesis_id":g.genesis_id().hex(),"canonical_genesis":g.encode().hex(),"validator_set_digest":vs.digest().hex(),"vdf_params_hash":g.vdf.digest().hex()},open("genesis.json","w"))
          print("GENESIS_MANIFEST_4OF4_IDENTITIES_OK genesis_id="+g.genesis_id().hex()+" network_id="+net.hex()+" validator_set_digest="+vs.digest().hex())
          PY
      - uses: actions/upload-artifact@v4
        with: {name: g4-genesis, path: genesis.json}
  bootstrap:
    needs: [manifest]
    strategy:
      fail-fast: false
      matrix: {node: ["153","154","155","157"]}
    runs-on: [self-hosted, "tep-testnet-${{ matrix.node }}"]
    steps:
      - uses: actions/download-artifact@v4
        with: {name: g4-genesis}
      - name: Bind immutable genesis and reject foreign network
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib
          g=json.load(open("genesis.json"))
          def bind(x):
           r=urllib.request.Request("http://127.0.0.1:47840/genesis/bind",data=json.dumps(x).encode(),headers={"Content-Type":"application/json"});return json.load(urllib.request.urlopen(r,timeout=3))
          a=bind(g);assert a["bind_status"] in ("BOUND","IDEMPOTENT");b=bind(g);assert b["bind_status"]=="IDEMPOTENT"
          foreign=dict(g);foreign["network_id"]=hashlib.sha3_256(b"FOREIGN-NETWORK").hexdigest()
          try:bind(foreign);raise AssertionError("foreign network accepted")
          except urllib.error.HTTPError as e:assert e.code==409
          mutated=dict(g);mutated["canonical_genesis"]=g["canonical_genesis"][:-2]+("00" if g["canonical_genesis"][-2:]!="00" else "01")
          try:bind(mutated);raise AssertionError("mutated genesis accepted")
          except urllib.error.HTTPError as e:assert e.code==409
          print("GENESIS_BOOTSTRAP_NEGATIVE_OK node_id="+a["node_id"]+" immutable=1 foreign_network_rejected=1 mutation_rejected=1")
          PY
      - name: Restart and prove persistent chain identity
        run: |
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/genesis > head.json 2>/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json
          g=json.load(open("genesis.json"));h=json.load(open("head.json"));assert h["bound"] and h["genesis_id"]==g["genesis_id"] and h["network_id"]==g["network_id"] and h["chain_id"]==g["chain_id"]
          print("GENESIS_RESTART_CONTINUITY_OK node_id="+h["node_id"]+" genesis_id="+h["genesis_id"])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: "g4-head-${{ matrix.node }}", path: head.json}
  converge:
    needs: [bootstrap]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "g4-head-*", path: heads}
      - run: |
          python3 - <<'PY'
          import glob,json
          hs=[json.load(open(p)) for p in glob.glob("heads/**/head.json",recursive=True)];assert len(hs)==4
          for k in ("network_id","chain_id","genesis_id","canonical_genesis"):assert len({x[k] for x in hs})==1
          assert len({x["node_id"] for x in hs})==4
          print("GENESIS_NETWORK_PRODUCTION_4OF4_OK genesis_id="+hs[0]["genesis_id"]+" network_id="+hs[0]["network_id"]+" chain_id="+hs[0]["chain_id"]+" converged_hosts=4 immutable=1 cross_network_rejected=1 restart_continuity=1")
          PY
