name: TEP v1.0 G1 enrollment production four-host gate
on:
  push:
    branches: [mainnet/v1.0.0-g1-enrollment]
    paths:
      - src/hashburst_tep/enrollment.py
      - tools/testnet_peer_v040.py
      - .github/workflows/v100-g1-enrollment-4host.yml
permissions: {contents: read}
concurrency:
  group: tep-v100-g1-enrollment-4host
  cancel-in-progress: false
jobs:
  enrollment-host:
    strategy:
      fail-fast: false
      matrix: {node: ["153","154","155","157"]}
    runs-on: [self-hosted, "tep-testnet-${{ matrix.node }}"]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Deploy exact G1 peer payload through restricted boundary
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          allowed="$(sudo -n -l)"
          grep -Fq "(root) NOPASSWD: /usr/local/sbin/hashburst-testnet-admin install-payload /opt/actions-runner/actions-runner/_work/tep/tep" <<<"$allowed"
          if sudo -n true 2>/dev/null; then echo UNRESTRICTED_SUDO; exit 20; fi
          sudo -n /usr/local/sbin/hashburst-testnet-admin install-payload "$GITHUB_WORKSPACE"
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:47840/health
      - name: Production enrollment certificate and negative security tests
        env:
          PYTHONPATH: src
          HB_G1_STATE: ${{ runner.temp }}/hb-g1-enrollment-${{ github.run_id }}-${{ matrix.node }}
        run: |
          set -euo pipefail
          rm -rf "$HB_G1_STATE"; mkdir -p "$HB_G1_STATE"
          python3 - <<'PY'
          import json,os,time,urllib.request
          from hashlib import sha3_256
          from hashburst_tep.enrollment import EnrollmentController,challenge_message,verify_certificate
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          def get(path):
              return json.load(urllib.request.urlopen("http://127.0.0.1:47840"+path,timeout=3))
          def post(path,obj):
              req=urllib.request.Request("http://127.0.0.1:47840"+path,data=json.dumps(obj).encode(),headers={"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(req,timeout=3))
          h=get("/health");nid=bytes.fromhex(h["node_id"]);pk=bytes.fromhex(h["public_key"])
          network=sha3_256(b"HB-TEP-G1-ENROLLMENT-PRODUCTION-GATE-v1").digest()
          controller=EnrollmentController(os.environ["HB_G1_STATE"],network)
          q=os.urandom(32);resp=post("/enrollment/challenge",{"network_id":network.hex(),"challenge":q.hex()})
          assert bytes.fromhex(resp["node_id"])==nid and bytes.fromhex(resp["public_key"])==pk
          sig=bytes.fromhex(resp["signature"]);Ed25519PublicKey.from_public_bytes(pk).verify(sig,challenge_message(network,nid,q))
          now=int(time.time());cert=controller.issue(nid,pk,"node",now-5,now+3600,q,sig)
          assert verify_certificate(cert,controller.private_key.public_key(),now,network)
          cid=cert.certificate_id()
          try: controller.issue(nid,pk,"node",now-5,now+3600,q,sig); raise AssertionError("replay accepted")
          except ValueError as e: assert "replay" in str(e)
          q2=os.urandom(32);r2=post("/enrollment/challenge",{"network_id":network.hex(),"challenge":q2.hex()});s2=bytes.fromhex(r2["signature"])
          try: controller.issue(nid,pk,"validator",now-5,now+3600,q2,s2); raise AssertionError("validator scope accepted")
          except ValueError as e: assert "scope" in str(e)
          controller2=EnrollmentController(os.environ["HB_G1_STATE"],network)
          assert controller2.controller_id==controller.controller_id
          assert verify_certificate(cert,controller2.private_key.public_key(),now,network)
          print("ENROLLMENT_CERTIFICATE_OK node_id="+nid.hex()+" controller_id="+controller.controller_id.hex()+" certificate_id="+cid.hex()+" serial="+str(cert.serial),flush=True)
          print("ENROLLMENT_NEGATIVE_SECURITY_OK replay_rejected=1 validator_scope_rejected=1",flush=True)
          PY
      - name: Node and controller restart continuity
        env:
          PYTHONPATH: src
          HB_G1_STATE: ${{ runner.temp }}/hb-g1-enrollment-${{ github.run_id }}-${{ matrix.node }}
        run: |
          set -euo pipefail
          before="$(curl -fsS http://127.0.0.1:47840/health)"
          sudo -n /usr/local/sbin/hashburst-testnet-admin restart
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:47840/health >/dev/null 2>&1 && break; sleep 1; done
          BEFORE="$before" python3 - <<'PY'
          import json,os,urllib.request
          from hashlib import sha3_256
          from hashburst_tep.enrollment import EnrollmentController
          b=json.loads(os.environ["BEFORE"]);a=json.load(urllib.request.urlopen("http://127.0.0.1:47840/health",timeout=3))
          assert a["node_id"]==b["node_id"] and a["public_key"]==b["public_key"]
          network=sha3_256(b"HB-TEP-G1-ENROLLMENT-PRODUCTION-GATE-v1").digest()
          c=EnrollmentController(os.environ["HB_G1_STATE"],network)
          assert c.registry._state["next_serial"]>=2 and len(c.registry._state["used_challenges"])>=2
          print("ENROLLMENT_RESTART_RECOVERY_OK node_id="+a["node_id"]+" controller_id="+c.controller_id.hex(),flush=True)
          PY
  certify:
    needs: [enrollment-host]
    runs-on: ubuntu-22.04
    steps:
      - run: echo "ENROLLMENT_PRODUCTION_4OF4_OK certificates=4 replay_rejected=4 validator_scope_rejected=4 restart_recovery=4"
