        shell: bash
        run: *deploy_prereq

  preflight-157:
    runs-on: [self-hosted, Linux, X64, tep-testnet-157]
    timeout-minutes: 10
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only host inventory
        env:
          EXPECTED_IP: "77.90.188.157"
          RUNNER_LABEL: "tep-testnet-157"
        shell: bash
        run: *preflight
      - name: Verify restricted privilege boundary and bootstrap isolated paths
        shell: bash
        run: *restricted_bootstrap
